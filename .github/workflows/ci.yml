name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  api-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check API
        run: |
          find apps/api/src -name '*.js' -print0 | xargs -0 -n1 node --check

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        working-directory: services/ai-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        working-directory: services/ai-worker
        run: |
          python -m pytest tests/ -q --ignore=tests/test_competitive_intel.py

  docker:
    needs: [api-syntax, worker-tests]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: apps/api
          - name: web
            context: apps/web
          - name: realtime
            context: services/realtime
          - name: ai-worker
            context: services/ai-worker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4010' }}
            NEXT_REWRITE_API_URL=${{ vars.NEXT_REWRITE_API_URL || 'http://api:4010' }}
            NEXT_PUBLIC_SC_HOST=${{ vars.NEXT_PUBLIC_SC_HOST || 'localhost' }}
            NEXT_PUBLIC_SC_PORT=${{ vars.NEXT_PUBLIC_SC_PORT || '8000' }}
            NEXT_PUBLIC_SC_SECURE=${{ vars.NEXT_PUBLIC_SC_SECURE || 'false' }}

  deploy:
    name: Deploy
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: github-deploy

    env:
      REMOTE: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/agent-market' }}
      IMAGE_TAG: latest

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync compose files
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            docker-compose.yml docker-compose.prebuilt.yml \
            "$REMOTE:$DEPLOY_PATH/"

      - name: Deploy application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$REMOTE" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml pull
          IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up -d --remove-orphans
          docker image prune -f
          IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml ps
          EOF