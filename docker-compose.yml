services:
  redis:
    image: redis:7-alpine
    container_name: agentmarket_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentmarket_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api/uploads:/app/uploads
    depends_on:
      - redis

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentmarket_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api/uploads:/app/uploads
    depends_on:
      - redis
    command: ["node", "src/queue/worker.js"]

  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: agentmarket_realtime
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SC_HOST: ${NEXT_PUBLIC_SC_HOST}
        NEXT_PUBLIC_SC_PORT: ${NEXT_PUBLIC_SC_PORT}
    container_name: agentmarket_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: '0.0.0.0'
    depends_on:
      - api
      - realtime

volumes:
  redis_data:
