services:
  mongo:
    image: mongo:7
    container_name: agentmarket_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: agentmarket_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agentmarket_api
    restart: unless-stopped
    ports:
      - '4010:4010'
    env_file:
      - .env
    environment:
      PORT: 4010
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/agentmarket
      WORKER_API_SECRET: ${WORKER_API_SECRET}
    volumes:
      - ./apps/api/uploads:/app/uploads
    depends_on:
      - redis
      - mongo

  celery-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: agentmarket_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/agentmarket
      INTERNAL_API_URL: http://api:4010
      WORKER_API_SECRET: ${WORKER_API_SECRET}
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - ./apps/api/uploads:/data/uploads
    depends_on:
      - redis
      - mongo
    command: ["celery", "-A", "celery_app:celery_app", "worker", "-l", "info"]

  celery-beat:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: agentmarket_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017/agentmarket
      INTERNAL_API_URL: http://api:4010
      WORKER_API_SECRET: ${WORKER_API_SECRET}
    depends_on:
      - redis
      - mongo
    command: ["celery", "-A", "celery_app:celery_app", "beat", "-l", "info"]

  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: agentmarket_realtime
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Browser must reach API/realtime on the host (not service DNS names).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4010}
        # Baked into next.config rewrites — must be reachable from the web container (service DNS).
        NEXT_REWRITE_API_URL: ${NEXT_REWRITE_API_URL:-http://api:4010}
        NEXT_PUBLIC_SC_HOST: ${NEXT_PUBLIC_SC_HOST:-localhost}
        NEXT_PUBLIC_SC_PORT: ${NEXT_PUBLIC_SC_PORT:-8000}
        NEXT_PUBLIC_SC_SECURE: ${NEXT_PUBLIC_SC_SECURE:-false}
    container_name: agentmarket_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: '0.0.0.0'
    depends_on:
      - api
      - realtime

volumes:
  redis_data:
  mongo_data:
